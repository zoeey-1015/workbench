<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%23e8739e'/><text x='50' y='68' text-anchor='middle' fill='white' font-size='50' font-family='sans-serif'>台</text></svg>">
<title>我的工作台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; background: linear-gradient(180deg, #fef0f5, #fce4ec); color: #4a2535; -webkit-tap-highlight-color: transparent; height: 100vh; overflow: hidden; }

/* ===== LAYOUT ===== */
.app { display: flex; height: 100vh; }
.sidebar { width: 130px; min-width: 130px; background: linear-gradient(180deg, #fdf0f5, #fce4ec); display: flex; flex-direction: column; border-right: 1px solid #f0c0d0; overflow-y: auto; }
.main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 40px; }

/* Sidebar header */
.sidebar-header { padding: 16px 10px 10px; text-align: center; }
.sidebar-header .title { font-size: 16px; font-weight: 700; color: #db4d8a; }
.sidebar-header .date { font-size: 10px; color: #d4a0b5; margin-top: 2px; }

/* Sidebar coin */
.sidebar-coin { margin: 6px 10px; padding: 8px; background: #fff; border-radius: 10px; text-align: center; }
.sidebar-coin .coin-val { font-size: 20px; font-weight: 700; color: #e8739e; }
.sidebar-coin .coin-lbl { font-size: 10px; color: #b08896; }

/* Sidebar nav */
.sidebar-nav { flex: 1; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 13px; color: #4a2535; transition: all 0.15s; border: none; background: transparent; font-family: inherit; text-align: left; width: 100%; }
.nav-item:active { background: #fef0f5; }
.nav-item.active { background: #fff; font-weight: 600; color: #db4d8a; box-shadow: 0 1px 3px rgba(219,77,138,0.1); }
.nav-item .ni-icon { font-size: 18px; width: 22px; text-align: center; }
.nav-item .ni-badge { font-size: 10px; background: #e8739e; color: #fff; padding: 1px 6px; border-radius: 8px; margin-left: auto; min-width: 18px; text-align: center; }

/* Sidebar spend */
.sidebar-spend { padding: 8px 10px; border-top: 1px solid #f0c0d0; }
.sidebar-spend input { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #f0c0d0; font-size: 12px; font-family: inherit; margin-bottom: 4px; }
.sidebar-spend select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #f0c0d0; font-size: 11px; margin-bottom: 4px; }
.sidebar-spend button { width: 100%; padding: 6px; border-radius: 6px; border: none; background: #e8739e; color: #fff; font-size: 12px; cursor: pointer; font-family: inherit; margin-bottom: 4px; }

/* ===== MAIN CONTENT ===== */
.panel { display: none; }
.panel.active { display: block; }

.section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #4a2535; }

.habits { display: flex; gap: 8px; flex-wrap: wrap; }
.habit-card { flex: 1; min-width: 90px; background: #fff; border-radius: 12px; padding: 14px; text-align: center; cursor: pointer; user-select: none; transition: all 0.15s; border: 2px solid transparent; }
.habit-card:active { transform: scale(0.96); }
.habit-card.done { border-color: #e8739e; background: #fef0f5; }
.habit-card .habit-icon { font-size: 26px; margin-bottom: 4px; }
.habit-card .habit-name { font-size: 12px; font-weight: 500; }

/* Arabic */
.phase-badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #fef0f5; color: #db4d8a; margin-bottom: 10px; }
.arabic-task, .check-task { display: flex; align-items: flex-start; gap: 10px; padding: 10px; margin-bottom: 6px; background: #fff5f8; border-radius: 10px; }
.task-check { width: 22px; height: 22px; min-width: 22px; border-radius: 11px; border: 2px solid #e8b0c5; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.15s; margin-top: 1px; }
.task-check.done { background: #e8739e; border-color: #e8739e; color: #fff; }
.task-info { flex: 1; }
.task-info .task-desc { font-size: 14px; line-height: 1.4; }
.task-info .task-time { font-size: 11px; color: #b08896; margin-top: 2px; }
.task-info .task-detail { font-size: 12px; color: #888; margin-top: 4px; }
.arabic-letters-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.arabic-progress { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
.arabic-progress .prog-label { font-size: 12px; color: #b08896; white-space: nowrap; }
.arabic-progress .prog-bar { flex: 1; height: 6px; background: #fce4ec; border-radius: 3px; overflow: hidden; }
.arabic-progress .prog-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #e8739e, #db4d8a); }
.arabic-full-done, .habit-done-btn { margin-top: 10px; text-align: center; }
.arabic-full-done button, .habit-done-btn button { padding: 10px 24px; border-radius: 10px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
.btn-done { background: linear-gradient(135deg, #e8739e, #db4d8a); color: #fff; }
.btn-done:active { opacity: 0.85; }
.btn-secondary { background: linear-gradient(135deg, #d4a0b5, #c088a0); color: #fff; }
.arabic-phase-nav { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }
.arabic-phase-nav button { padding: 6px 16px; border-radius: 8px; border: 1px solid #f0c0d0; background: #fff; font-size: 12px; cursor: pointer; font-family: inherit; color: #4a2535; }
.arabic-phase-nav button:active { background: #fef0f5; }
.arabic-phase-nav button.warn { border-color: #ff9500; color: #ff9500; }

/* Shared inputs */
.small-input, .product-input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #f0c0d0; font-size: 13px; font-family: inherit; background: #fff; margin-bottom: 8px; }
.small-input:focus, .product-input:focus { outline: none; border-color: #e8739e; }
.reading-log { font-size: 12px; color: #b08896; margin-top: 4px; }

/* Routine */
.routine-list { margin-bottom: 8px; }
.routine-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 4px; background: #fff5f8; border-radius: 8px; }
.routine-item .drag-handle { color: #e8b0c5; cursor: grab; font-size: 14px; padding: 2px; }
.routine-item .routine-name { flex: 1; font-size: 14px; cursor: pointer; }
.routine-item .routine-product { font-size: 11px; color: #e8739e; margin-left: 4px; }
.routine-item .routine-x { color: #e8b0c5; cursor: pointer; padding: 2px 6px; font-size: 16px; }
.routine-add-row { display: flex; gap: 8px; margin-bottom: 10px; }
.routine-add-row input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #f0c0d0; font-size: 13px; font-family: inherit; background: #fff; }
.routine-add-row button { padding: 8px 14px; border-radius: 8px; border: none; background: #e8739e; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; }

.product-detail { margin-top: 6px; padding: 8px 10px; background: #fef0f5; border-radius: 8px; font-size: 12px; display: none; }
.product-detail.show { display: block; }
.product-detail .pd-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.product-detail .pd-row input { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #f0c0d0; font-size: 12px; font-family: inherit; }
.product-detail .pd-row select { padding: 6px 8px; border-radius: 6px; border: 1px solid #f0c0d0; font-size: 12px; }

/* custom tasks */
.custom-task-row { display: flex; gap: 8px; margin-bottom: 10px; }
.custom-task-row input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #f0c0d0; font-size: 13px; font-family: inherit; background: #fff; }
.custom-task-row input:focus { outline: none; border-color: #e8739e; }
.custom-task-row button { padding: 8px 14px; border-radius: 8px; border: none; background: #e8739e; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; }
.custom-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 4px; background: #fff5f8; border-radius: 8px; }
.custom-item .custom-text { flex: 1; font-size: 14px; }
.custom-item .custom-x { color: #e8b0c5; cursor: pointer; padding: 2px 6px; font-size: 16px; }
.note-input-area { margin-bottom: 12px; }
.note-input-area textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #f0c0d0; font-size: 14px; font-family: inherit; background: #fff; min-height: 80px; resize: vertical; }
.note-input-area textarea:focus { outline: none; border-color: #e8739e; }
.note-input-area .note-actions { display: flex; gap: 8px; margin-top: 8px; }
.note-input-area .note-actions button { padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
.btn-save { background: #e8739e; color: #fff; flex: 1; }
.btn-save:active { opacity: 0.85; }
.btn-tag { background: #fff5f8; color: #b08896; font-size: 12px !important; padding: 8px 10px !important; border: 1px solid #f0c0d0 !important; }
.btn-tag:active { background: #fef0f5; }
.note-list { list-style: none; }
.note-item { padding: 12px 0; border-bottom: 1px solid #fce4ec; }
.note-item:last-child { border-bottom: none; }
.note-item .note-date { font-size: 11px; color: #d4a0b5; margin-bottom: 4px; }
.note-item .note-body { font-size: 14px; white-space: pre-wrap; line-height: 1.5; }
.note-item .note-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.note-item .note-tag { font-size: 10px; background: #fce4ec; color: #b08896; padding: 2px 8px; border-radius: 10px; }
.note-delete { float: right; background: none; border: none; color: #e8b0c5; font-size: 16px; cursor: pointer; padding: 0 4px; margin-top: -2px; }
.tag-filter { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.tag-filter .tfilter { font-size: 11px; padding: 4px 10px; border-radius: 12px; border: 1px solid #f0c0d0; background: #fff; cursor: pointer; font-family: inherit; color: #4a2535; }
.tag-filter .tfilter.active { background: #e8739e; color: #fff; border-color: #e8739e; }

/* coin history */
.coin-mini-history { font-size: 10px; color: #b08896; padding: 8px 10px; border-top: 1px solid #f0c0d0; max-height: 80px; overflow-y: auto; }
.coin-mini-history .ch-item { margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #e8739e, #db4d8a); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 100; }
.toast.show { opacity: 1; }
.empty { text-align: center; color: #d4a0b5; padding: 16px; font-size: 13px; }

@keyframes coinPop { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }
.coin-pop { animation: coinPop 0.4s ease; }

/* Responsive: mobile stacks, sidebar becomes top tab bar */
@media (max-width: 600px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; min-width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px; padding: 6px; border-right: none; border-bottom: 1px solid #f0c0d0; overflow-y: visible; }
  .sidebar-header { padding: 0 4px; text-align: left; }
  .sidebar-header .title { font-size: 14px; }
  .sidebar-header .date { display: none; }
  .sidebar-coin { margin: 0 4px; padding: 4px 8px; }
  .sidebar-coin .coin-val { font-size: 16px; }
  .sidebar-spend { display: none; }
  .coin-mini-history { display: none; }
  .sidebar-nav { flex-direction: row; gap: 2px; padding: 0; overflow-x: auto; }
  .nav-item { font-size: 11px; padding: 6px 8px; white-space: nowrap; gap: 4px; border-radius: 8px; }
  .nav-item .ni-icon { font-size: 14px; width: auto; }
  .nav-item .ni-badge { display: none; }
  .main { padding: 10px; height: 0; flex: 1; }
  .habits { gap: 6px; }
  .habit-card { min-width: 70px; padding: 10px 6px; }
  .habit-card .habit-icon { font-size: 22px; }
}
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="title">🌸 工作台</div>
      <div class="date" id="todayDate"></div>
    </div>
    <div class="sidebar-coin">
      <div class="coin-val" id="coinBalance">0</div>
      <div class="coin-lbl">💰 金币</div><div style="font-size:10px;color:#d4a0b5;cursor:pointer;margin-top:2px;" onclick="resetCoins()">重置</div>
    </div>
    <div class="sidebar-nav">
      <button class="nav-item active" onclick="switchPanel('daily')"><span class="ni-icon">🏠</span> 今日<span class="ni-badge" id="dailyBadge"></span></button>
      <button class="nav-item" onclick="switchPanel('arabic')"><span class="ni-icon">📖</span> 阿语</button>
      <button class="nav-item" onclick="switchPanel('reading')"><span class="ni-icon">📚</span> 阅读</button>
      <button class="nav-item" onclick="switchPanel('skincare')"><span class="ni-icon">🧴</span> 护肤</button>
      <button class="nav-item" onclick="switchPanel('custom')"><span class="ni-icon">📋</span> 任务</button>
      <button class="nav-item" onclick="switchPanel('supplement')"><span class="ni-icon">💊</span> 补剂</button>
      <button class="nav-item" onclick="switchPanel('notes')"><span class="ni-icon">💬</span> 笔记</button>
    </div>
    <div class="sidebar-spend">
      <input type="number" id="spendAmount" placeholder="花了多少？" min="1">
      <select id="spendCategory">
        <option value="">分类</option><option value="衣服">衣服</option><option value="护肤">护肤</option>
        <option value="吃喝">吃喝</option><option value="游戏">游戏</option><option value="其他">其他</option>
      </select>
      <button onclick="spendCoins()" style="margin-bottom:4px;">💸 扣金币</button><button onclick="resetAllData()" style="width:100%;padding:4px;border-radius:6px;border:1px solid #ffaaaa;background:#fff;color:#cc6666;font-size:10px;cursor:pointer;font-family:inherit;">🔄 重置所有数据</button>
    </div>
    <div class="coin-mini-history" id="coinHistory"></div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main">
    <!-- DAILY -->
    <div class="panel active" id="panel-daily">
      <div class="section-title">今日打卡</div>
      <div class="habits" id="habitList"></div>
    </div>

    <!-- ARABIC -->
    <div class="panel" id="panel-arabic">
      <div class="section-title">阿语学习</div>
      <div id="arabicPanel"></div>
    </div>

    <!-- READING -->
    <div class="panel" id="panel-reading">
      <div class="section-title">阅读</div>
      <div id="readingPanel"></div>
    </div>

    <!-- SKINCARE -->
    <div class="panel" id="panel-skincare">
      <div class="section-title">护肤</div>
      <div id="skincarePanel"></div>
    </div>

    <!-- CUSTOM -->
    <div class="panel" id="panel-custom">
      <div class="section-title">自定义任务 <span style="font-size:12px;color:#d4a0b5;font-weight:400;">填分钟，每25min = +10💰</span></div>
      <div id="customPanel"></div>
    </div>
    <!-- SUPPLEMENT -->
    <div class="panel" id="panel-supplement">
      <div class="section-title">💊 补剂提醒</div>
      <div id="supplementPanel"></div>
    </div>
    <!-- NOTES -->
    <div class="panel" id="panel-notes">
      <div class="section-title">随手记</div>
      <div class="note-input-area">
        <textarea id="noteBody" placeholder="写什么都行……"></textarea>
        <div class="note-actions">
          <button class="btn-tag" onclick="addTag('组会')">组会</button>
          <button class="btn-tag" onclick="addTag('TODO')">TODO</button>
          <button class="btn-tag" onclick="addTag('想法')">想法</button>
          <button class="btn-save" onclick="saveNote()">保存</button>
        </div>
      </div>
      <div class="tag-filter" id="tagFilter"></div>
      <ul class="note-list" id="noteList"></ul>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TODAY = new Date().toISOString().split('T')[0];
function S(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e) { return fb; } }
function SS(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

// ========== COIN SYSTEM ==========
let coinBalance = S('coin_balance', 0);
let coinHistory = S('coin_history', []);
const COIN_RULES = { tomato_min: 25, tomato_coin: 10, skincare: 1, custom_min_rate: 10 }; // 10 coins per 25min tomato

function earnCoins(amount, reason) {
  coinBalance += amount;
  coinHistory.push({ date: TODAY, amount: '+' + amount, reason: reason });
  SS('coin_balance', coinBalance); SS('coin_history', coinHistory);
  updateCoinUI();
  toast('+' + amount + ' 💰 ' + reason);
}
function spendCoins() {
  const amt = parseInt(document.getElementById('spendAmount').value);
  const cat = document.getElementById('spendCategory').value || '消费';
  if (!amt || amt <= 0) { toast('输入花了多少钱呀'); return; }
  if (amt > coinBalance) { toast('金币不够！还差 ' + (amt - coinBalance) + ' 💰'); return; }
  coinBalance -= amt;
  coinHistory.push({ date: TODAY, amount: '-' + amt, reason: cat });
  SS('coin_balance', coinBalance); SS('coin_history', coinHistory);
  document.getElementById('spendAmount').value = '';
  updateCoinUI();
  toast('已扣除 ' + amt + ' 💰 · ' + cat);
}
function updateCoinUI() {
  document.getElementById('coinBalance').textContent = coinBalance;
  const hist = coinHistory.slice().reverse().slice(0, 8);
  document.getElementById('coinHistory').innerHTML = hist.map(h =>
    '<div class="ch-item"><span style="color:' + (h.amount.startsWith('+') ? '#e8739e' : '#888') + ';">' + h.amount + '</span> ' + escHtml(h.reason) + '</div>'
  ).join('') || '<div style="font-size:10px;color:#d4a0b5;">打卡攒金币 💪</div>';
  updateDoneBadge();
}

// ========== PANEL SWITCHING ==========
let currentPanel = 'daily';
function switchPanel(name) {
  currentPanel = name;
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    const panels = ['daily','arabic','reading','skincare','custom','supplement','notes'];
    el.classList.toggle('active', panels[i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  // Re-render the active panel
  if (name === 'daily') renderHabitCards();
  if (name === 'arabic') renderArabic();
  if (name === 'reading') renderReading();
  if (name === 'skincare') renderSkincare();
  if (name === 'custom') renderCustom();
  if (name === 'supplement') renderSupplement();
  if (name === 'notes') renderNotes();
}

// ========== GLOBAL DATA ==========
let habitData = S('habit_data', {});
let readingData = S('reading_data', {});
// Pomodoro timer state for reading
let timerState = S('timer_state', { running: false, startTime: null, elapsed: 0, tomatoes: 0, tomatoMinutes: 25 });
let timerInterval = null;
let skincareRoutine = S('skincare_routine', [
  { id:'s1', name:'卸妆 / 洁面', product:'', rating:0, productNote:'' },
  { id:'s2', name:'爽肤水', product:'', rating:0, productNote:'' },
  { id:'s3', name:'精华', product:'', rating:0, productNote:'' },
  { id:'s4', name:'眼霜', product:'', rating:0, productNote:'' },
  { id:'s5', name:'面霜 / 乳液', product:'', rating:0, productNote:'' },
  { id:'s6', name:'防晒', product:'', rating:0, productNote:'' },
]);
let skincareDone = S('skincare_done', {});
let productLog = S('product_log', []);
let customData = S('custom_data', {});
let supplementData = S('supplement_data', []);
// Each: { id, name, onDays, offDays, startDate, dosage, log: { '2026-08-01': true, ... } }
let notesData = S('notes_data', []);
let currentFilter = S('note_filter', '');
let currentTags = [];
let nextId = S('skincare_next_id', 7);
let habitEarnedToday = S('habit_earned_today', {});

const HABIT_DEFS = [
  { id: 'arabic', name: '阿语学习', icon: '📖' },
  { id: 'reading', name: '阅读 30min', icon: '📚' },
  { id: 'skincare', name: '护肤', icon: '🧴' },
];

function updateDoneBadge() {
  const today = habitData[TODAY] || {};
  const done = HABIT_DEFS.filter(h => today[h.id]).length;
  const badge = document.getElementById('dailyBadge');
  if (badge) badge.textContent = done === 0 ? '' : done + '/3';
  document.getElementById('todayDate').textContent = TODAY + ' ' + ['日','一','二','三','四','五','六'][new Date().getDay()];
}
function renderHabitCards() {
  const today = habitData[TODAY] || {};
  document.getElementById('habitList').innerHTML = HABIT_DEFS.map(h => {
    const done = today[h.id] || false;
    return '<div class="habit-card' + (done ? ' done' : '') + '" onclick="toggleHabit(\'' + h.id + '\')">'
      + '<div class="habit-icon">' + h.icon + '</div>'
      + '<div class="habit-name">' + (done ? '✅ ' : '') + h.name + '</div></div>';
  }).join('');
}
let habitEarnedCoins = S('habit_earned_coins', {}); // { date: { id: coinsEarned } }

function startTimer() {

  let html = '<div class="custom-task-row"><input id="customInput" placeholder="任务描述"><input id="customMins" placeholder="预计分钟" style="width:70px;flex:none;" type="number" min="1" step="5" value="25"><button onclick="addCustomTask()">+ 添加</button></div>';

  if (todayTasks.length === 0 && yestTasks.length === 0) {
    html += '<div class="empty">今天还没有自定义任务</div>';
  }

  // Show yesterday's unfinished tasks
  if (yestTasks.length > 0) {
    html += '<div style="font-size:12px;color:#b08896;margin:8px 0 4px;">📅 昨天未完成 → 点击移到今天</div>';
    html += yestTasks.map(function(t, i) {
      return '<div style="padding:8px 10px;margin-bottom:4px;background:#fff5f8;border-radius:8px;opacity:0.85;">'
        + '<div style="display:flex;align-items:center;gap:8px;">'
        + '<div style="font-size:12px;color:#b08896;">⏳</div>'
        + '<span style="flex:1;font-size:14px;color:#888;">' + escHtml(t.text) + ' (' + (t.mins||25) + 'min)</span>'
        + '<button onclick="moveTaskFromYesterday(' + i + ')" style="padding:4px 10px;border-radius:6px;border:none;background:#e8739e;color:#fff;font-size:11px;cursor:pointer;font-family:inherit;">移到今天</button>'
        + '</div></div>';
    }).join('');
  }

  if (todayTasks.length > 0) {
    html += '<div style="font-size:12px;color:#b08896;margin:8px 0 4px;">📋 今日任务</div>';
    html += todayTasks.map(function(t, i) {
      var done = t.done || false;
      var doneMins = t.doneMins || 0;
      var total = t.mins || 25;
      var pct = Math.round(doneMins / total * 100);
      return '<div style="padding:8px 10px;margin-bottom:4px;background:#fff5f8;border-radius:8px;">'
        + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">'
        + '<div class="task-check' + (done ? ' done' : '') + '" onclick="toggleCustom(' + i + ')" style="cursor:pointer;">' + (done ? '✓' : '') + '</div>'
        + '<span style="flex:1;font-size:14px;' + (done ? 'text-decoration:line-through;color:#d4a0b5;' : '') + '">' + escHtml(t.text) + '</span>'
        + '<button onclick="editCustomMins(' + i + ')" title="调整预估时间" style="padding:2px 6px;border-radius:4px;border:1px solid #f0c0d0;background:#fff;color:#b08896;font-size:10px;cursor:pointer;font-family:inherit;">✎</button>'
        + '<span class="custom-x" onclick="deleteCustom(' + i + ')">✕</span>'
        + '</div>'
        + '<div style="display:flex;align-items:center;gap:6px;padding-left:30px;">'
        + '<input type="number" id="customProgress' + i + '" value="' + doneMins + '" min="0" max="' + total + '" style="width:55px;padding:4px 6px;border-radius:6px;border:1px solid #f0c0d0;font-size:11px;font-family:inherit;" onchange="updateCustomProgress(' + i + ',this.value)">'
        + '<span style="font-size:10px;color:#b08896;">/ ' + total + 'min</span>'
        + '<div style="flex:1;height:4px;background:#fce4ec;border-radius:2px;overflow:hidden;">'
        + '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#e8739e,#db4d8a);border-radius:2px;"></div></div>'
        + '<span style="font-size:10px;color:#b08896;">' + pct + '%</span>'
        + '</div></div>';
    }).join('');
  }
  document.getElementById('customPanel').innerHTML = html;
}
function addCustomTask() { const text = document.getElementById('customInput').value.trim(); if (!text) return; const mins = parseInt(document.getElementById('customMins').value) || 25; if (!customData[TODAY]) customData[TODAY] = []; customData[TODAY].push({ text: text, done: false, mins: mins }); SS('custom_data', customData); renderCustom(); toast('已添加 ✓'); }
function editCustomMins(i) {
  var t = customData[TODAY][i];
  var newMins = prompt('调整「' + t.text + '」的预估时间（分钟）：', t.mins || 25);
  if (newMins === null) return;
  var m = parseInt(newMins);
  if (!m || m <= 0) { toast('请输入有效的分钟数'); return; }
  t.mins = m;
  if (t.doneMins > m) t.doneMins = m;
  t.done = t.doneMins >= m;
  SS('custom_data', customData); renderCustom();
  toast('已更新预估时间 → ' + m + 'min');
}
function moveTaskFromYesterday(i) {
  var yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  var yestKey = yesterday.toISOString().split('T')[0];
  var t = customData[yestKey][i];
  customData[yestKey].splice(i, 1);
  if (customData[yestKey].length === 0) delete customData[yestKey];
  if (!customData[TODAY]) customData[TODAY] = [];
  customData[TODAY].push({ text: t.text, done: false, mins: t.mins || 25 });
  SS('custom_data', customData); renderCustom();
  toast('已移到今天 📋');
}
function toggleCustom(i) {
  const t = customData[TODAY][i];
  const wasDone = t.done;
  t.done = !t.done;
  if (!wasDone && t.done) {
    t.doneMins = t.mins || 25;
    const tomatoes = Math.floor(t.doneMins / COIN_RULES.tomato_min);
    const earned = tomatoes * COIN_RULES.tomato_coin;
    if (earned > 0) earnCoins(earned, '完成: ' + t.text.slice(0, 10) + ' ' + t.doneMins + 'min');
  } else if (wasDone && !t.done) {
    const doneMins = t.doneMins || 25;
    const tomatoes = Math.floor(doneMins / COIN_RULES.tomato_min);
    const earned = tomatoes * COIN_RULES.tomato_coin;
    if (earned > 0) {
      coinBalance -= earned;
      coinHistory.push({ date: TODAY, amount: '-' + earned, reason: '取消: ' + t.text.slice(0, 10) });
      SS('coin_balance', coinBalance); SS('coin_history', coinHistory);
    }
    t.doneMins = 0;
    updateCoinUI();
  }
  SS('custom_data', customData); renderCustom();
}
function updateCustomProgress(i, val) {
  const v = parseInt(val) || 0;
  const t = customData[TODAY][i];
  const total = t.mins || 25;
  t.doneMins = Math.max(0, Math.min(total, v));
  t.done = t.doneMins >= total;
  SS('custom_data', customData); renderCustom();
}
function deleteCustom(i) { customData[TODAY].splice(i, 1); SS('custom_data', customData); renderCustom(); }


// ========== SUPPLEMENT ==========
function isSupplementDay(supp, dateStr) {
  // Calculate if dateStr falls in an "on" period
  var start = new Date(supp.startDate + 'T00:00:00');
  var target = new Date(dateStr + 'T00:00:00');
  var diffDays = Math.floor((target - start) / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return false; // before start date
  var cycleLen = (supp.onDays || 7) + (supp.offDays || 7);
  var dayInCycle = diffDays % cycleLen;
  return dayInCycle < (supp.onDays || 7);
}

function getNextSupplementDays(supp, fromDate, count) {
  // Get next N "on" days starting from fromDate
  var result = [];
  var d = new Date(fromDate + 'T00:00:00');
  while (result.length < (count || 14)) {
    var ds = d.toISOString().split('T')[0];
    if (isSupplementDay(supp, ds)) result.push(ds);
    d.setDate(d.getDate() + 1);
  }
  return result;
}

function getCycleInfo(supp) {
  var start = new Date(supp.startDate + 'T00:00:00');
  var today = new Date(TODAY + 'T00:00:00');
  var diffDays = Math.floor((today - start) / (1000 * 60 * 60 * 24));
  var cycleLen = (supp.onDays || 7) + (supp.offDays || 7);
  var dayInCycle = diffDays % cycleLen;
  if (diffDays < 0) {
    return { isOn: false, dayInCycle: null, cycleLen: cycleLen, daysUntilStart: -diffDays };
  }
  var isOn = dayInCycle < (supp.onDays || 7);
  var daysLeftInPhase;
  if (isOn) {
    daysLeftInPhase = (supp.onDays || 7) - dayInCycle - 1;
  } else {
    daysLeftInPhase = cycleLen - dayInCycle - 1;
  }
  return {
    isOn: isOn,
    dayInCycle: dayInCycle,
    cycleLen: cycleLen,
    onDays: supp.onDays || 7,
    offDays: supp.offDays || 7,
    daysLeftInPhase: daysLeftInPhase,
    phase: isOn ? '服药期' : '停药期',
    phaseDay: isOn ? (dayInCycle + 1) : (dayInCycle - (supp.onDays || 7) + 1),
    phaseTotal: isOn ? (supp.onDays || 7) : (supp.offDays || 7)
  };
}

function renderSupplement() {
  var html = '';

  // Add new supplement form
  html += '<details style="margin-bottom:12px;background:#fff5f8;border-radius:10px;padding:10px;">';
  html += '<summary style="cursor:pointer;font-size:13px;font-weight:500;color:#db4d8a;">+ 添加补剂</summary>';
  html += '<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">';
  html += '<input id="newSuppName" placeholder="补剂名称（如：叶黄素）" class="small-input" style="margin-bottom:0;">';
  html += '<input id="newSuppDosage" placeholder="剂量（如：1粒/次）" class="small-input" style="margin-bottom:0;" value="1粒">';
  html += '<div style="display:flex;gap:6px;">';
  html += '<input id="newSuppOn" placeholder="吃几天" type="number" min="1" value="7" style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid #f0c0d0;font-size:13px;font-family:inherit;">';
  html += '<input id="newSuppOff" placeholder="停几天" type="number" min="1" value="7" style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid #f0c0d0;font-size:13px;font-family:inherit;">';
  html += '</div>';
  html += '<div style="font-size:11px;color:#b08896;">周期：吃X天停X天。首次开始日期默认今天，可在添加后修改。</div>';
  html += '<input id="newSuppStart" type="date" placeholder="首次开始日期" style="padding:8px 10px;border-radius:8px;border:1px solid #f0c0d0;font-size:13px;font-family:inherit;" value="' + TODAY + '">';
  html += '<button onclick="addSupplement()" style="padding:8px;border-radius:8px;border:none;background:#e8739e;color:#fff;font-size:13px;cursor:pointer;font-family:inherit;">添加补剂</button>';
  html += '</div></details>';

  if (supplementData.length === 0) {
    html += '<div class="empty">还没有补剂，点上方添加 📝</div>';
  }

  supplementData.forEach(function(supp, idx) {
    var info = getCycleInfo(supp);
    var tookToday = (supp.log && supp.log[TODAY]) || false;

    html += '<div style="background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(219,77,138,0.06);">';

    // Header row
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">';
    html += '<span style="font-size:20px;">💊</span>';
    html += '<div style="flex:1;">';
    html += '<div style="font-size:15px;font-weight:600;color:#4a2535;">' + escHtml(supp.name) + '</div>';
    html += '<div style="font-size:11px;color:#b08896;">' + escHtml(supp.dosage || '') + ' · 吃' + (supp.onDays||7) + '停' + (supp.offDays||7) + '</div>';
    html += '</div>';

    // Today's action button
    if (info.isOn) {
      if (tookToday) {
        html += '<span style="background:#e8739e;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;">✅ 已吃</span>';
      } else {
        html += '<button onclick="takeSupplement(' + idx + ')" style="padding:8px 20px;border-radius:20px;border:none;background:linear-gradient(135deg,#e8739e,#db4d8a);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">💊 吃药 +1💰</button>';
      }
    } else {
      html += '<span style="background:#fce4ec;color:#b08896;padding:6px 14px;border-radius:20px;font-size:12px;">今日停药</span>';
    }
    html += '</div>';

    // Cycle status bar
    html += '<div style="margin-bottom:6px;">';
    html += '<div style="display:flex;justify-content:space-between;font-size:10px;color:#b08896;margin-bottom:3px;">';
    html += '<span>' + info.phase + ' 第' + info.phaseDay + '天/' + info.phaseTotal + '天</span>';
    if (info.isOn) {
      html += '<span>还剩 ' + info.daysLeftInPhase + ' 天服药</span>';
    } else {
      html += '<span>还剩 ' + info.daysLeftInPhase + ' 天停药</span>';
    }
    html += '</div>';
    // Progress bar for current cycle
    var cyclePct = Math.round((info.dayInCycle + 1) / info.cycleLen * 100);
    html += '<div style="height:6px;background:#fce4ec;border-radius:3px;overflow:hidden;display:flex;">';
    var onPct = Math.round((info.onDays) / info.cycleLen * 100);
    html += '<div style="height:100%;width:' + onPct + '%;background:#e8739e;border-radius:3px 0 0 3px;"></div>';
    html += '<div style="height:100%;width:' + (100 - onPct) + '%;background:#f0d0e0;"></div>';
    html += '</div>';
    html += '<div style="display:flex;justify-content:space-between;font-size:9px;color:#d4a0b5;margin-top:2px;">';
    html += '<span>吃' + (supp.onDays||7) + '天</span><span>停' + (supp.offDays||7) + '天</span>';
    html += '</div></div>';

    // Next 7 days mini calendar
    var nextDays = [];
    var d = new Date(TODAY + 'T00:00:00');
    for (var j = 0; j < 7; j++) {
      var ds = d.toISOString().split('T')[0];
      var dayName = ['日','一','二','三','四','五','六'][d.getDay()];
      var isOn = isSupplementDay(supp, ds);
      var took = (supp.log && supp.log[ds]) || false;
      var isToday = ds === TODAY;
      nextDays.push({ date: ds, dayName: dayName, isOn: isOn, took: took, isToday: isToday });
      d.setDate(d.getDate() + 1);
    }
    html += '<div style="display:flex;gap:3px;margin-top:8px;">';
    nextDays.forEach(function(nd) {
      var bg = nd.isToday ? '#fef0f5' : '#fafafa';
      var border = nd.isToday ? '1px solid #e8739e' : '1px solid #f0e0e8';
      var color = nd.isToday ? '#db4d8a' : '#888';
      html += '<div style="flex:1;text-align:center;background:' + bg + ';border:' + border + ';border-radius:6px;padding:4px 2px;font-size:10px;line-height:1.3;">';
      html += '<div style="color:#b08896;">' + nd.dayName + '</div>';
      html += '<div style="font-size:14px;color:' + (nd.isOn ? '#e8739e' : '#d4a0b5') + ';">' + (nd.took ? '✓' : (nd.isOn ? '💊' : '·')) + '</div>';
      html += '</div>';
    });
    html += '</div>';

    // Controls
    html += '<div style="display:flex;gap:4px;margin-top:8px;">';
    html += '<button onclick="editSupplement(' + idx + ')" style="padding:4px 10px;border-radius:6px;border:1px solid #f0c0d0;background:#fff;color:#b08896;font-size:10px;cursor:pointer;font-family:inherit;">✎ 编辑</button>';
    html += '<button onclick="deleteSupplement(' + idx + ')" style="padding:4px 10px;border-radius:6px;border:1px solid #ffcccc;background:#fff;color:#cc8888;font-size:10px;cursor:pointer;font-family:inherit;">删除</button>';
    html += '</div></div>';
  });

  document.getElementById('supplementPanel').innerHTML = html;
}

function addSupplement() {
  var name = document.getElementById('newSuppName').value.trim();
  if (!name) { toast('请输入补剂名称'); return; }
  var dosage = document.getElementById('newSuppDosage').value.trim() || '1粒';
  var onDays = parseInt(document.getElementById('newSuppOn').value) || 7;
  var offDays = parseInt(document.getElementById('newSuppOff').value) || 7;
  var startDate = document.getElementById('newSuppStart').value || TODAY;
  supplementData.push({
    id: 'sup_' + Date.now(),
    name: name,
    dosage: dosage,
    onDays: onDays,
    offDays: offDays,
    startDate: startDate,
    log: {}
  });
  SS('supplement_data', supplementData);
  renderSupplement();
  toast('已添加补剂 💊 ' + name);
}

function takeSupplement(idx) {
  var supp = supplementData[idx];
  if (!supp.log) supp.log = {};
  if (supp.log[TODAY]) { toast('今天已经吃过啦 ✅'); return; }
  supp.log[TODAY] = true;
  SS('supplement_data', supplementData);
  earnCoins(1, '吃补剂: ' + supp.name);
  updateCoinUI(); renderSupplement();
  toast('💊 已记录！+1💰');
}

function editSupplement(idx) {
  var supp = supplementData[idx];
  var newName = prompt('补剂名称：', supp.name);
  if (newName === null) return;
  var newDosage = prompt('剂量（如：1粒、2片、5ml）：', supp.dosage || '');
  if (newDosage === null) return;
  var newOn = prompt('吃几天（数字）：', supp.onDays || 7);
  if (newOn === null) return;
  var newOff = prompt('停几天（数字）：', supp.offDays || 7);
  if (newOff === null) return;
  var newStart = prompt('首次开始日期（YYYY-MM-DD）：', supp.startDate || TODAY);
  if (newStart === null) return;
  supp.name = newName.trim() || supp.name;
  supp.dosage = newDosage.trim();
  supp.onDays = parseInt(newOn) || 7;
  supp.offDays = parseInt(newOff) || 7;
  supp.startDate = newStart.trim() || supp.startDate;
  SS('supplement_data', supplementData);
  renderSupplement();
  toast('已更新 ✎');
}

function deleteSupplement(idx) {
  var supp = supplementData[idx];
  if (!confirm('确定删除「' + supp.name + '」？')) return;
  supplementData.splice(idx, 1);
  SS('supplement_data', supplementData);
  renderSupplement();
  toast('已删除');
}



// ========== NOTES ==========
function saveNote() { const body = document.getElementById('noteBody').value.trim(); if (!body) return; notesData.push({ body, date: TODAY, tags: currentTags.slice() }); SS('notes_data', notesData); document.getElementById('noteBody').value = ''; currentTags = []; renderNotes(); toast('已保存 📝'); }
function addTag(tag) { if (!currentTags.includes(tag)) currentTags.push(tag); document.querySelectorAll('.btn-tag').forEach(b => { if (b.textContent === tag) { b.style.background = '#e8739e'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 200); } }); toast('标签: ' + currentTags.join(', ')); }
function renderTagFilter() { const tags = {}; notesData.forEach(n => { (n.tags||[]).forEach(t => { tags[t] = (tags[t]||0)+1; }); }); const e = Object.entries(tags).sort((a,b) => b[1]-a[1]); if (e.length===0) { document.getElementById('tagFilter').innerHTML=''; return; } let h='<button class="tfilter' + (!currentFilter?' active':'') + '" onclick="setFilter(\'\')">全部</button>'; e.forEach(([t,c]) => { h+='<button class="tfilter' + (currentFilter===t?' active':'') + '" onclick="setFilter(\''+escAttr(t)+'\')">'+escHtml(t)+' ('+c+')</button>'; }); document.getElementById('tagFilter').innerHTML=h; }
function setFilter(t) { currentFilter=t; SS('note_filter', currentFilter); renderNotes(); }
function renderNotes() { renderTagFilter(); let f=notesData.slice().reverse(); if (currentFilter) f=f.filter(n=>(n.tags||[]).includes(currentFilter)); const l=document.getElementById('noteList'); if (f.length===0) { l.innerHTML='<div class="empty">'+(currentFilter?'这个标签下还没有笔记':'还没有笔记，写点什么吧')+'</div>'; return; } l.innerHTML=f.map(n=>{ const i=notesData.indexOf(n); return '<li class="note-item"><button class="note-delete" onclick="deleteNote('+i+')">✕</button><div class="note-date">'+n.date+'</div><div class="note-body">'+escHtml(n.body)+'</div>' + ((n.tags&&n.tags.length)?'<div class="note-tags">'+n.tags.map(t=>'<span class="note-tag">'+escHtml(t)+'</span>').join('')+'</div>':'')+'</li>'; }).join(''); }
function deleteNote(i) { notesData.splice(i, 1); SS('notes_data', notesData); renderNotes(); }

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function exportData() {
  var all = {};
  ['coin_balance','coin_history','habit_data','habit_earned_today','habit_earned_coins','arabic_task_data','skincare_done','custom_data','supplement_data','reading_data','arabic_data','timer_state'].forEach(function(k) {
    var v = localStorage.getItem(k);
    if (v) all[k] = JSON.parse(v);
  });
  var blob = new Blob([JSON.stringify(all, null, 2)], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = 'workbench_backup_' + TODAY + '.json';
  a.click(); URL.revokeObjectURL(url);
  toast('📥 数据已导出！');
}
function resetAllData() { if(!confirm("确定重置金币和今日打卡记录？（笔记、产品、护肤步骤等不受影响）")) return;
  ['coin_balance','coin_history','habit_data','habit_earned_today','habit_earned_coins','arabic_task_data','skincare_done','custom_data','reading_data','arabic_data'].forEach(k => localStorage.removeItem(k));
  location.reload();
}
function toast(m) { const e=document.getElementById('toast'); e.innerHTML=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'), 1800); }

updateCoinUI();
renderHabitCards();
